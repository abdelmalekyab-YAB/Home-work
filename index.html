<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A5B">
<title>Le cahier — Lina & Ilyes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Nunito:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A5B; --ink-soft:#4B5B8A; --paper:#FBFAF6; --grid:#CBD8EF;
  --lina:#E0399A; --ilyes:#0E9C8E; --green:#17864F; --red:#D4342A;
  --amber:#E08A00; --shadow:0 6px 0 rgba(27,42,91,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Nunito',system-ui,-apple-system,sans-serif;
  color:var(--ink); background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:100% 30px, 30px 100%;
  min-height:100vh; padding:env(safe-area-inset-top) 0 40px;
}
.wrap{max-width:820px; margin:0 auto; padding:18px 16px 0;}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif; margin:0; line-height:1.15;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
.card{background:#fff; border:2.5px solid var(--ink); border-radius:18px; box-shadow:var(--shadow);}

/* ---------- top bar ---------- */
.bar{display:flex; align-items:center; gap:10px; margin-bottom:14px; min-height:44px;}
.back{font-size:15px; font-weight:700; color:var(--ink); padding:9px 14px; border-radius:12px;
      background:#fff; border:2px solid var(--ink);}
.bar .who{margin-left:auto; font-weight:700; font-size:14px; padding:7px 14px; border-radius:999px; color:#fff;}

/* ---------- home ---------- */
.hero{text-align:center; padding:22px 0 12px;}
.hero h1{font-size:clamp(34px,9vw,54px); letter-spacing:-.5px;}
.hero p{margin:8px 0 0; font-size:16px; color:var(--ink-soft);}
.pick{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:22px;}
@media(max-width:520px){ .pick{grid-template-columns:1fr;} }
.who-card{padding:22px 18px; text-align:left; position:relative; overflow:hidden;}
.who-card .label{font-family:'Patrick Hand',cursive; font-size:34px; line-height:1;}
.who-card .yr{font-size:14px; font-weight:700; color:var(--ink-soft); margin-top:6px;}
.who-card .tape{position:absolute; top:-14px; right:18px; width:64px; height:34px;
  background:rgba(255,225,120,.75); transform:rotate(8deg);}
.who-card .dots{margin-top:16px; display:flex; gap:5px;}
.who-card .dots i{width:9px; height:9px; border-radius:50%; display:block;}

/* ---------- chapter list ---------- */
.subject{margin:22px 0 10px; display:flex; align-items:baseline; gap:10px;}
.subject h2{font-size:22px;}
.subject span{font-size:13px; color:var(--ink-soft); font-weight:700;}
.chap{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px;}
.chap .n{width:38px; height:38px; flex:none; border-radius:11px; display:grid; place-items:center;
         font-family:'Baloo 2'; font-size:19px; color:#fff;}
.chap .t{flex:1; min-width:0;}
.chap .t b{display:block; font-size:16.5px; font-family:'Baloo 2'; font-weight:600;}
.chap .t small{font-size:12.5px; color:var(--ink-soft);}
.chap .stars{font-size:15px; letter-spacing:1px; white-space:nowrap; color:#D9D2C0;}
.chap .stars .on{color:var(--amber);}
.chap .score{font-family:'Patrick Hand',cursive; font-size:19px; color:var(--red); white-space:nowrap;}

/* ---------- exercise ---------- */
.prog{height:9px; border-radius:99px; background:#E7E3D6; overflow:hidden; margin-bottom:16px;}
.prog i{display:block; height:100%; border-radius:99px; transition:width .35s ease;}
.qcard{padding:20px 18px 18px;}
.qmeta{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px;}
.q{font-size:clamp(20px,5vw,26px); font-family:'Baloo 2'; font-weight:600; line-height:1.35;}
.q .blank{border-bottom:3px dotted var(--ink-soft); padding:0 22px;}
.qhelp{margin-top:8px; font-size:14px; color:var(--ink-soft); font-style:italic;}
.answer{margin-top:18px;}
input.txt{width:100%; font-family:'Patrick Hand',cursive; font-size:30px; color:var(--ink);
  padding:10px 14px; border:none; border-bottom:3px solid var(--ink); background:#FFFDF4; border-radius:8px 8px 0 0;}
input.txt:focus{outline:none; background:#FFF8DC;}
.choices{display:grid; gap:10px;}
.choice{padding:14px 16px; text-align:left; font-size:18px; font-weight:700; background:#fff;
  border:2.5px solid var(--ink); border-radius:14px; box-shadow:var(--shadow); color:var(--ink);}
.choice.sel{background:#FFF3B0;}
.choice[disabled]{opacity:.55;}
.choice.good{background:#DFF5E8; border-color:var(--green); color:var(--green);}
.choice.bad{background:#FDE7E5; border-color:var(--red); color:var(--red);}
.tools{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.tool{font-size:13.5px; font-weight:700; padding:9px 13px; border-radius:11px; border:2px solid var(--ink-soft);
  color:var(--ink-soft); background:#fff;}
.tool.on{background:var(--ink); color:#fff; border-color:var(--ink);}
.cta{display:block; width:100%; margin-top:16px; padding:17px; border-radius:16px; color:#fff;
  font-family:'Baloo 2'; font-size:21px; font-weight:600; box-shadow:0 5px 0 rgba(0,0,0,.18);}
.cta:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
.cta.ghost{background:#fff; color:var(--ink); border:2.5px solid var(--ink); box-shadow:var(--shadow);}

/* feedback */
.fb{margin-top:16px; padding:16px 16px 14px; border-radius:16px; border:2.5px solid; display:flex; gap:12px;}
.fb.ok{background:#EAF7EF; border-color:var(--green);}
.fb.no{background:#FDF0EF; border-color:var(--red);}
.fb .mark{flex:none; width:40px;}
.fb h3{font-size:19px; margin-bottom:4px;}
.fb.ok h3{color:var(--green);} .fb.no h3{color:var(--red);}
.fb p{margin:4px 0 0; font-size:14.5px; line-height:1.5;}
.fb .sol{font-family:'Patrick Hand',cursive; font-size:22px;}
@keyframes draw{to{stroke-dashoffset:0;}}
.mark path{stroke-dasharray:120; stroke-dashoffset:120; animation:draw .45s ease forwards;}

/* pavé de chiffres */
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:14px;}
.keypad button{font-family:'Baloo 2'; font-weight:600; font-size:27px; padding:15px 0; color:var(--ink);
  background:#fff; border:2.5px solid var(--ink); border-radius:14px; box-shadow:var(--shadow);}
.keypad button:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(27,42,91,.12);}
.keypad button.alt{background:#FFF3B0;}

/* canvas */
.padwrap{margin-top:14px; border:2.5px dashed var(--ink-soft); border-radius:14px; background:#FFFDF4; overflow:hidden;}
canvas{display:block; width:100%; height:210px; touch-action:none;}
.padbar{display:flex; gap:10px; align-items:center; padding:8px; border-top:2px dashed var(--ink-soft);}
.padhint{font-size:13px; font-weight:700; color:var(--ink-soft); line-height:1.3;}

/* deux étapes */
.steplab{font-size:13.5px; font-weight:700; color:var(--ink-soft); margin:14px 0 4px;}
.steplab b{color:var(--ink);}
input.txt.active{background:#FFF3B0; border-bottom-color:var(--ink);}
input.txt.done{background:#EAF7EF; border-bottom-color:var(--green); color:var(--green);}
.tt{display:inline;}
.i{display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; margin-left:7px;
   border:2px solid var(--ink-soft); color:var(--ink-soft); border-radius:50%; font-size:12px; font-weight:700;
   font-family:'Nunito',sans-serif; font-style:normal; line-height:1; vertical-align:middle; cursor:pointer; user-select:none;}
.i:active{background:var(--ink-soft); color:#fff;}
.frx{display:none; font-size:13.5px; font-style:italic; font-weight:600; color:#1D4ED8;
     font-family:'Nunito',sans-serif; margin-top:4px; line-height:1.35;}
.tt.open .frx{display:block;}
.ptab{width:100%; border-collapse:collapse; font-size:13px; margin-top:6px;}
.ptab th{text-align:left; font-size:11.5px; color:var(--ink-soft); border-bottom:2px solid #E7E3D6; padding:5px 4px;}
.ptab td{padding:7px 4px; border-bottom:1px dotted #DDD8C8;}
.ptab td.r{text-align:right; white-space:nowrap;}
.pct{font-family:'Patrick Hand',cursive; font-size:19px;}
.bars{display:flex; align-items:flex-end; gap:6px; height:110px; margin-top:8px;}
.bars > div{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px;}
.bars .bar{width:100%; border-radius:6px 6px 0 0; min-height:3px;}
.bars small{font-size:10px; color:var(--ink-soft); text-align:center; line-height:1.15;}
.field{margin-top:10px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:3px;}
.field input, .field select, .field textarea{width:100%; font-family:'Nunito',sans-serif; font-size:15px; padding:9px 11px;
  border:2px solid var(--ink); border-radius:10px; background:#fff; color:var(--ink);}
.field textarea{min-height:60px;}
.qrow{display:flex; gap:8px; align-items:flex-start; padding:8px; border:2px solid #E7E3D6; border-radius:10px; margin-top:8px; font-size:13px;}
.qrow b{flex:1;}
.del{color:var(--red); font-weight:700; font-size:13px; border:2px solid var(--red); border-radius:9px; padding:4px 9px; background:#fff;}
.wallet{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; margin-bottom:12px;}
.wallet .coin{width:56px; height:56px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:28px; background:#FFE9A8; border:3px solid #E08A00;}
.wallet .amt{font-family:'Baloo 2',sans-serif; font-size:26px; font-weight:700; color:#B45309; line-height:1;}
.task{display:flex; gap:12px; align-items:center; padding:11px 13px; border:2.5px solid var(--ink); border-radius:14px;
      background:#fff; margin-bottom:9px; box-shadow:var(--shadow);}
.task .ti{flex:1; min-width:0; font-size:14.5px; font-weight:700;}
.task .pay{font-family:'Baloo 2',sans-serif; font-size:17px; color:#B45309; white-space:nowrap;}
.task .go{font-size:13.5px; font-weight:700; padding:8px 12px; border-radius:11px; color:#fff; border:none;}
.badge-wait{font-size:11.5px; font-weight:700; color:#B45309; background:#FFF3B0; border-radius:999px; padding:3px 9px;}
.quote{border:2.5px solid var(--ink); border-radius:18px; background:#FFF8DC; padding:14px 16px; text-align:center; box-shadow:var(--shadow);}
.quote .en{font-family:'Baloo 2',sans-serif; font-size:19px; font-weight:600; line-height:1.3;}
.quote .fr{font-size:14px; margin-top:4px;}
.quote .arq{font-family:'Noto Naskh Arabic',serif; direction:rtl; font-size:19px; margin-top:6px; line-height:1.8;}
.subcard{display:flex; gap:14px; align-items:center; width:100%; text-align:left; padding:16px; margin-bottom:12px;}
.subcard .ic{width:56px; height:56px; flex:none; border-radius:16px; display:grid; place-items:center; font-size:27px; color:#fff;}
.subcard .bd{flex:1; min-width:0;}
.subcard .ti{font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:600;}
.subcard .st{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
.subcard .barw{height:9px; border-radius:99px; background:#E7E3D6; margin-top:7px; overflow:hidden;}
.subcard .barw i{display:block; height:100%; border-radius:99px;}
.subcard .msg{font-size:12.5px; font-weight:700; margin-top:5px;}
.newbadge{display:inline-block; background:#E08A00; color:#fff; font-size:11px; font-weight:700;
  border-radius:999px; padding:2px 9px; margin-left:6px; vertical-align:middle;}
.ava{border-radius:50%; object-fit:cover; border:4px solid; display:block; background:#fff;}
.ar{font-family:'Noto Naskh Arabic','Geeza Pro','Arabic Typesetting',serif; direction:rtl; unicode-bidi:isolate;}
.arbig{font-family:'Noto Naskh Arabic','Geeza Pro',serif; direction:rtl; unicode-bidi:isolate;
  font-size:52px; line-height:1.5; display:inline-block; vertical-align:middle;}
.argrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:9px; margin-top:10px;}
.argrid button{background:#fff; border:2.5px solid var(--ink); border-radius:14px; box-shadow:var(--shadow); padding:10px 4px;}
.argrid button:active{transform:translateY(3px); box-shadow:none;}
.argrid .g{font-family:'Noto Naskh Arabic',serif; font-size:34px; line-height:1.2; color:var(--ink);}
.argrid .n{font-size:11px; font-weight:700; color:var(--ink-soft);}
.argrid .p{font-size:10.5px; font-style:italic; font-weight:700; color:#1D4ED8; line-height:1.2; margin-top:1px;}
.forms{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:10px;}
.forms > div{border:2.5px solid #E7E3D6; border-radius:14px; background:#fff; padding:10px 4px; text-align:center;}
.forms .f{font-family:'Noto Naskh Arabic',serif; font-size:44px; line-height:1.4; color:var(--ink);}
.forms .lab{font-size:11.5px; font-weight:700; color:var(--ink-soft); line-height:1.25;}
.forms .none{font-size:13px; color:#C7C2B2; padding:14px 0;}
.speak{font-size:15px; font-weight:700; padding:10px 15px; border-radius:12px; border:2.5px solid var(--ink);
  background:#FFF3B0; color:var(--ink); box-shadow:var(--shadow);}
.fb.tip{background:#FFFBEB; border-color:var(--amber);}
.fb.tip h3{color:var(--amber);}

/* results */
.result{padding:26px 20px; text-align:center;}
.result .big{font-family:'Patrick Hand',cursive; font-size:64px; color:var(--red); line-height:1;}
.result .circle{display:inline-block; padding:14px 26px; border:4px solid var(--red); border-radius:50%/40%;}
.result h2{font-size:26px; margin:16px 0 6px;}
.result p{font-size:15.5px; color:var(--ink-soft); margin:0 auto; max-width:44ch;}
.recap{margin-top:18px; text-align:left;}
.recap div{display:flex; gap:10px; padding:9px 4px; border-bottom:1px dotted #C9C2AF; font-size:14.5px;}
.recap b{flex:none; width:24px; text-align:center;}
.foot{text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:26px;}
.hide{display:none !important;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================ DONNÉES */
const DATA = {
  lina: { name:"Lina", ar:"لينا", year:"Year 5", accent:"var(--lina)", hex:"#E0399A", emoji:"🌸",
    subjects:[
      { name:"Maths", note:"Place value & decimals", sets:[
        { id:"l-pv", title:"La maison des nombres", sub:"Place value — millions → unités", qs:[
          {t:"choice", q:"In <b>347</b>, which column is the <b>4</b> in?", c:["ones","tens","hundreds","tenths"], a:1,
           e:"Le 4 est le deuxième chiffre en partant de la droite : c'est la colonne des <b>tens</b> (dizaines)."},
          {t:"choice", q:"In <b>6 218</b>, what is the value of the <b>6</b>?", c:["6","60","600","6 000"], a:3,
           e:"Le 6 est dans la colonne des <b>thousands</b> (milliers), donc il vaut 6 000."},
          {t:"choice", q:"In <b>8.3</b>, which column is the <b>3</b> in?", c:["tens","ones","tenths","hundredths"], a:2,
           e:"Juste après le point décimal, c'est la colonne des <b>tenths</b> (dixièmes)."},
          {t:"choice", q:"In <b>14.07</b>, what is the value of the <b>7</b>?", c:["7","0.7","0.07","70"], a:2,
           e:"Deuxième place après le point = <b>hundredths</b> (centièmes), donc 0.07."},
          {t:"choice", q:"In <b>1 503 264</b>, which column is the <b>5</b> in?", c:["thousands","ten thousands","hundred thousands","millions"], a:2,
           e:"1 | 503 | 264 : le 5 est le premier chiffre du groupe des milliers, donc <b>hundred thousands</b> (centaines de mille) = 500 000."},
          {t:"num", q:"What is the value of the <b>9</b> in <b>92.75</b>?", a:90,
           e:"Le 9 est dans la colonne des dizaines (tens) : il vaut 90."},
          {t:"num", q:"Which digit is in the <b>tens</b> place in <b>4582.37</b>?", a:8,
           e:"4 5 <b>8</b> 2 . 3 7 → le chiffre des dizaines est le 8."},
          {t:"num", q:"Which digit is in the <b>hundredths</b> place in <b>4582.37</b>?", a:7,
           e:"Après le point : 3 = tenths, 7 = hundredths. La réponse est 7."}
        ]},
        { id:"l-dec", title:"Les décimales", sub:"Tenths, hundredths, thousandths", qs:[
          {t:"choice", q:"<b>0.1</b> is the same as…", c:["1/10","1/100","1/1000","10"], a:0,
           e:"0.1 = un dixième = 1/10 (one tenth)."},
          {t:"choice", q:"<b>0.01</b> is called…", c:["one tenth","one hundredth","one thousandth","one unit"], a:1,
           e:"0.01 = un centième = <b>one hundredth</b>."},
          {t:"num", q:"0.5 = <span class='blank'></span> / 10", a:5, e:"0.5 = 5 dixièmes = 5/10."},
          {t:"num", q:"0.36 = <span class='blank'></span> / 100", a:36, e:"Deux chiffres après le point = des centièmes : 36/100."},
          {t:"choice", q:"Which is bigger?", c:["0.4","0.35"], a:0,
           e:"On compare d'abord les dixièmes : 4 dixièmes > 3 dixièmes. Le nombre de chiffres ne fait pas la taille !"},
          {t:"choice", q:"Which is bigger?", c:["0.7","0.68"], a:0,
           e:"7 dixièmes contre 6 dixièmes : 0.7 est plus grand."},
          {t:"num", q:"Write <b>45 hundredths</b> as a decimal.", a:0.45, e:"45 centièmes = 0.45."},
          {t:"num", q:"Write <b>7 thousandths</b> as a decimal.", a:0.007, e:"7 millièmes = 0.007 (trois chiffres après le point)."}
        ]},
        { id:"l-x10", title:"× 10 et ÷ 10", sub:"Multiplier et diviser par 10, 100", qs:[
          {t:"num", q:"3.4 × 10 =", a:34, e:"× 10 : les chiffres se décalent d'un rang vers la gauche → 34."},
          {t:"num", q:"3.4 ÷ 10 =", a:0.34, e:"÷ 10 : les chiffres se décalent d'un rang vers la droite → 0.34."},
          {t:"num", q:"52 ÷ 10 =", a:5.2, e:"52 ÷ 10 = 5.2."},
          {t:"num", q:"0.6 × 100 =", a:60, e:"× 100 : deux rangs vers la gauche → 60."},
          {t:"num", q:"7.25 × 10 =", a:72.5, e:"7.25 × 10 = 72.5."},
          {t:"num", q:"480 ÷ 100 =", a:4.8, e:"480 ÷ 100 = 4.8."},
          {t:"num", q:"40 cm = <span class='blank'></span> m", a:0.4, e:"1 m = 100 cm, donc 40 ÷ 100 = 0.4 m."},
          {t:"num", q:"185 cm = <span class='blank'></span> m", a:1.85, e:"185 ÷ 100 = 1.85 m."}
        ]},
        { id:"l-cmp", title:"Comparer les nombres", sub:"Greater than, less than, equal", qs:[
          {t:"choice", q:"3 456 <span class='blank'></span> 3 465", c:["&gt;","&lt;","="], a:1,
           e:"Même début (34), puis 5 dizaines contre 6 dizaines : 3 456 est plus petit."},
          {t:"choice", q:"12.5 <span class='blank'></span> 12.50", c:["&gt;","&lt;","="], a:2,
           e:"Un zéro à la fin d'un nombre décimal ne change rien : 12.5 = 12.50."},
          {t:"choice", q:"0.7 <span class='blank'></span> 0.68", c:["&gt;","&lt;","="], a:0,
           e:"7 dixièmes > 6 dixièmes, donc 0.7 est plus grand."},
          {t:"choice", q:"109 999 <span class='blank'></span> 110 000", c:["&gt;","&lt;","="], a:1,
           e:"109 999 n'a pas encore atteint 110 000 : il est plus petit."},
          {t:"choice", q:"5.06 <span class='blank'></span> 5.6", c:["&gt;","&lt;","="], a:1,
           e:"0 dixième contre 6 dixièmes : 5.06 est plus petit."},
          {t:"choice", q:"2 400 000 <span class='blank'></span> 240 000", c:["&gt;","&lt;","="], a:0,
           e:"2 400 000 a un chiffre de plus : il est dix fois plus grand."},
          {t:"choice", q:"0.303 <span class='blank'></span> 0.33", c:["&gt;","&lt;","="], a:1,
           e:"Dixièmes égaux (3), puis 0 centième contre 3 centièmes : 0.303 est plus petit."},
          {t:"choice", q:"88.9 <span class='blank'></span> 88.90", c:["&gt;","&lt;","="], a:2,
           e:"Le zéro final ne change rien : les deux nombres sont égaux."}
        ]},
        { id:"l-words", title:"Numbers in words", sub:"Lire et écrire les nombres en anglais", qs:[
          {t:"choice", q:"How do you say <b>3 407</b>?", c:["three thousand four hundred and seven","three hundred and forty-seven","thirty-four thousand and seven"], a:0,
           e:"3 407 = three thousand four hundred and seven. En anglais britannique on met « and » après les centaines."},

/* ---- étapes guidées : où l'enfant doit écrire la ligne intermédiaire ---- */
(function addSteps(){
  const find = id => { for(const k in DATA) for(const su of DATA[k].subjects) for(const st of su.sets) if(st.id===id) return st; };
  const clean = s => s.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/=/g,'').trim();
  find('i-mm').qs.forEach(q=>{ q.step = { ask:"réécris le calcul en remplaçant « − − » par « + »", type:'expr', want:q.a, noDouble:true,
    ph:"par exemple −2 + 5",
    e:"Deux moins qui se touchent deviennent un plus. <b>−2 − −5</b> se réécrit <b>−2 + 5</b>." }; });
  find('i-br').qs.forEach(q=>{ const m = clean(q.q).match(/\(([^)]*)\)/); let v=null;
    try{ v = Function('"use strict";return ('+m[1]+')')(); }catch(e){}
    q.step = { ask:"combien fait la parenthèse ?", type:'num', a:v, ph:"la valeur de la parenthèse",
      e:"Avec BIDMAS, on calcule <b>toujours la parenthèse en premier</b>, sur une ligne à part." }; });
  find('i-eq').qs.forEach(q=>{ q.step = { ask:"écris le calcul qui donne x", type:'expr', want:q.a,
    ph:"par exemple 14 − 7 ou 6 ÷ −2",
    e:"J'utilise l'opération inverse : <b>+ devient −</b>, <b>× devient ÷</b>." }; });
})();

const TW = 'ـ';                                   // tatweel : le trait de liaison
const formIso = L => L.c;
const formIni = L => L.j ? L.c + TW : null;
const formMed = L => L.j ? TW + L.c + TW : null;
const formFin = L => TW + L.c;

/* prononciation par la synthèse vocale de la tablette */
const canSpeak = typeof window !== 'undefined' && 'speechSynthesis' in window;
let VOICES = [];
function refreshVoices(){ try{ VOICES = window.speechSynthesis.getVoices() || []; }catch(e){ VOICES = []; } }
if(canSpeak){ refreshVoices(); try{ window.speechSynthesis.onvoiceschanged = refreshVoices; }catch(e){} }
function pickVoice(lang){
  if(!VOICES.length) refreshVoices();
  const p = (lang||'').split('-')[0].toLowerCase();
  return VOICES.find(v => v.lang && v.lang.toLowerCase().replace('_','-') === (lang||'').toLowerCase())
      || VOICES.find(v => v.lang && v.lang.toLowerCase().startsWith(p)) || null;
}
/* iOS n'autorise la voix qu'après un premier geste de l'utilisateur */
let audioReady = false;
function unlockAudio(){
  if(audioReady || !canSpeak) return;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; window.speechSynthesis.speak(u); audioReady = true; }catch(e){}
}
document.addEventListener('pointerdown', unlockAudio, {once:true});

/* say() prévient quand rien ne peut être prononcé */
function say(txt, lang, onProblem){
  const L = lang || 'ar-SA';
  if(!canSpeak){ onProblem && onProblem("Cet appareil ne sait pas lire à voix haute."); return; }
  refreshVoices(); unlockAudio();
  const v = pickVoice(L);
  if(!VOICES.length){ onProblem && onProblem("Aucune voix n'est encore chargée. Réessaie dans deux secondes."); }
  else if(!v){
    const nom = L.startsWith('ar') ? 'arabe' : L.startsWith('en') ? 'anglaise' : 'française';
    onProblem && onProblem("Aucune voix "+nom+" sur cet appareil. Sur iPad : Réglages › Accessibilité › Contenu énoncé › Voix, puis télécharge la voix "+nom+".");
  }
  try{
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = L; u.rate = 0.75; if(v) u.voice = v;
    u.onerror = () => onProblem && onProblem("La lecture a été interrompue. Vérifie le volume et le mode silencieux.");
    window.speechSynthesis.cancel(); window.speechSynthesis.resume(); window.speechSynthesis.speak(u);
  }catch(e){ onProblem && onProblem("La lecture n'a pas pu démarrer."); }
}

/* ---------------- génération des chapitres d'exercices ---------------- */
(function buildArabic(){
  const shuffle = a => a.slice().sort(()=>Math.random()-0.5);
  const others = (i, n) => shuffle(AR.filter((_,k)=>k!==i)).slice(0,n);
  const mcq = (qEn, qFr, good, distractors, e) => {
    const opts = shuffle([good].concat(distractors));
    return { t:'choice', q:qEn, fr:qFr, c:opts, a:opts.indexOf(good), e };
  };

  // 1 à 4 : reconnaître le nom de la lettre, 7 par chapitre
  const nameSets = [];
  for(let g=0; g<4; g++){
    const part = AR.slice(g*7, g*7+7);
    nameSets.push({
      id:'ar-name'+(g+1),
      title:`Letter names (${g+1}/4)`, titleFr:`Le nom des lettres (${g+1}/4)`,
      sub:`Letters ${part[0].t} to ${part[6].t}`, subFr:`De ${part[0].t} à ${part[6].t}`,
      qs: part.map(L=>{ const i = AR.indexOf(L);
        return mcq(`What is this letter called? <span class="arbig">${L.c}</span>`,
                   `Comment s'appelle cette lettre ?`,
                   L.t, others(i,3).map(x=>x.t),
                   `C'est <b>${L.t}</b> (<span class="ar">${L.n}</span>) : ${L.sF}. Exemple : <span class="ar">${L.w}</span> = ${L.wf}.`);
      })
    });
  }

  // 5 : le son de la lettre
  const soundPick = shuffle(AR).slice(0,10);
  const soundSet = { id:'ar-sound', title:'The sound of the letters', titleFr:'Le son des lettres',
    sub:'Which letter makes this sound?', subFr:'Quelle lettre fait ce son ?',
    qs: soundPick.map(L=>{ const i = AR.indexOf(L);
      return mcq(`Which letter is pronounced like this: ${L.sE}?`,
                 `Quelle lettre se prononce ainsi : ${L.sF} ?`,
                 `<span class="ar" style="font-size:30px">${L.c}</span>`,
                 others(i,3).map(x=>`<span class="ar" style="font-size:30px">${x.c}</span>`),
                 `C'est <b>${L.t}</b> <span class="ar">${L.c}</span> : ${L.sF}.`);
    })};

  // 6 : reconnaître la place dans le mot
  const joiners = AR.filter(x=>x.j);
  const posList = [['Beginning of a word','au début du mot',formIni],
                   ['Middle of a word','au milieu du mot',formMed],
                   ['End of a word','à la fin du mot',formFin],
                   ['On its own','toute seule',formIso]];
  const formSet = { id:'ar-forms', title:'Where is the letter?', titleFr:'Où est la lettre ?',
    sub:'Beginning, middle, end or on its own', subFr:'Début, milieu, fin ou isolée',
    qs: shuffle(joiners).slice(0,6).map(L=>{
      const [en,fr,f] = posList[Math.floor(Math.random()*3)];
      return mcq(`Where is this letter used? <span class="arbig">${f(L)}</span>`,
                 `À quelle place cette lettre est-elle écrite ?`,
                 en, posList.filter(x=>x[0]!==en).map(x=>x[0]),
                 `Le trait de liaison montre la place : ${fr}. La forme isolée de cette lettre est <span class="ar">${L.c}</span> (${L.t}).`);
    }).concat(shuffle(joiners).slice(0,4).map(L=>{
      const k = Math.floor(Math.random()*3);
      const [en,fr,f] = posList[k];
      const good = f(L);
      const bad = posList.filter((_,j)=>j!==k).map(x=>x[2](L));
      return mcq(`Which one is <span class="ar">${L.c}</span> (${L.t}) ${en.toLowerCase()}?`,
                 `Laquelle est la lettre ${L.t} ${fr} ?`,
                 `<span class="ar" style="font-size:30px">${good}</span>`,
                 bad.map(b=>`<span class="ar" style="font-size:30px">${b}</span>`),
                 `${L.t} ${fr} s'écrit <span class="ar">${good}</span>.`);
    }))};

  // 7 : les lettres qui ne se lient pas
  const nonJ = AR.filter(x=>!x.j);
  const joinSet = { id:'ar-join', title:'Letters that never join', titleFr:'Les lettres qui ne se lient pas',
    sub:'ا د ذ ر ز و : they never join the next letter', subFr:'ا د ذ ر ز و : elles ne s\'attachent jamais à la suivante',
    qs: shuffle(nonJ).map(L=>{ const i = AR.indexOf(L);

const canZip = (typeof CompressionStream === 'function');
async function zip(str){
  const st = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(st).arrayBuffer();
  let bin = ''; const a = new Uint8Array(buf);
  for(let i=0;i<a.length;i++) bin += String.fromCharCode(a[i]);
  return btoa(bin);
}
async function unzip(b64){
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  const st = new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
let lastSize = { brut:0, envoye:0 };
let lastPullAt = 0, lastPushAt = 0;

async function remoteGet(){
  const u = SYNC.mode==='jsonbin' ? SYNC.url.replace(/\/$/,'')+'/latest' : SYNC.url;
  const h = SYNC.mode==='jsonbin' ? {'X-Master-Key':SYNC.key,'X-Bin-Meta':'false'}
                                  : (SYNC.key ? {'Authorization':'Bearer '+SYNC.key} : {});
  const r = await fetch(u,{headers:h});
  if(!r.ok) throw new Error('GET '+r.status);
  const j = await r.json();
  const o = (j && j.record) ? j.record : j;
  if(o && typeof o.z === 'string'){ try{ return JSON.parse(await unzip(o.z)); }catch(e){ return {}; } }
  return o;
}
async function remotePut(obj){
  const h = Object.assign({'Content-Type':'application/json'},
    SYNC.mode==='jsonbin' ? {'X-Master-Key':SYNC.key} : (SYNC.key ? {'Authorization':'Bearer '+SYNC.key} : {}));
  const clair = JSON.stringify(forRemote(obj));
  let body = clair;
  if(canZip){ try{ body = JSON.stringify({ z: await zip(clair) }); }catch(e){} }
  lastSize = { brut: Math.round(clair.length/1024), envoye: Math.round(body.length/1024) };
  const r = await fetch(SYNC.url,{method:'PUT',headers:h,body});
  if(!r.ok){
    const txt = await r.text().catch(()=> '');
    throw new Error('PUT ' + r.status + (r.status===400||r.status===413 ? ' — fichier trop gros ('+lastSize.envoye+' Ko)' : '') + ' ' + txt.slice(0,120));
  }
}

                catch(e){ syncState='hors ligne'; } }

/* fusion : on ne perd jamais le travail d'un appareil au profit d'un autre */
function mergeDB(a, b){                 // b (distant) fusionné dans a (local)
  const out = Object.assign({}, a);
  for(const k in b){
    const B = b[k], A = out[k];
    if(A === undefined || A === null){ out[k] = B; continue; }
    if(k.indexOf(':hist:') > 0 && Array.isArray(A) && Array.isArray(B)){
      const seen = new Set(), all = A.concat(B).sort((x,y)=>x.ts-y.ts)
        .filter(h => { const id = h.ts+'|'+h.set; if(seen.has(id)) return false; seen.add(id); return true; });
      out[k] = all.slice(-400);
    } else if(k.indexOf(':prog:') > 0 && typeof A === 'object' && typeof B === 'object'){
      const m = Object.assign({}, A);
      for(const id in B){
        const x = A[id], y = B[id];
        if(!x){ m[id] = y; continue; }
        m[id] = { total: y.total || x.total,
                  best : Math.max(x.best||0, y.best||0),
                  tries: Math.max(x.tries||0, y.tries||0),
                  last : (new Date(y.lastAt||0) > new Date(x.lastAt||0)) ? y.last : x.last,
                  lastAt: (new Date(y.lastAt||0) > new Date(x.lastAt||0)) ? y.lastAt : x.lastAt };
      }
      out[k] = m;
    } else if(k.indexOf(':sets:') > 0 && Array.isArray(A) && Array.isArray(B)){
      const ids = new Set(A.map(x=>x.id));
      out[k] = A.concat(B.filter(x=>!ids.has(x.id)));
    } else if(k.indexOf('_t:') === 0){
      out[k] = Math.max(A||0, B||0);
    } else if(k === 'cahier:code'){
      out[k] = A && A !== 'famille' ? A : B;
    } else {
      const ta = a['_t:'+k] || 0, tb = b['_t:'+k] || 0;   // la modification la plus récente gagne
      out[k] = (tb >= ta) ? B : A;
    }
  }
  return out;
}

/* la photo est redimensionnée en petit carré : elle doit rester légère pour la synchro */
function shrinkPhoto(file, size, cb){
  const img = new Image();
  img.onload = () => {
    try{
      const c = document.createElement('canvas'); c.width = size; c.height = size;
      const x = c.getContext('2d');
      const s = Math.min(img.width, img.height);
      x.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      cb(c.toDataURL('image/jpeg', 0.7));
    }catch(e){ cb(null); }
  };
  img.onerror = () => cb(null);
  const fr = new FileReader();
  fr.onload = () => { img.src = fr.result; };
  fr.onerror = () => cb(null);
  fr.readAsDataURL(file);
}

/* ---- entraînement quotidien : nouveaux mots + révisions espacées ---- */
const hashQ = t => { let h = 5381; const x = (t||'').replace(/<[^>]+>/g,''); 
  for(let i=0;i<x.length;i++) h = ((h*33) ^ x.charCodeAt(i)) >>> 0; return h.toString(36); };
const STEPS = [1, 2, 4, 8, 16, 30];     // en jours
function srsUpdate(k, ok){
  const r = SRS[k] || { s:0, n:0, w:0 };
  if(ok){ r.s = (r.s||0)+1; r.n = (r.n||0)+1; } else { r.s = 0; r.w = (r.w||0)+1; }
  r.due  = Date.now() + (ok ? STEPS[Math.min(r.s, STEPS.length-1)] : 1) * 864e5;
  r.last = Date.now();
  SRS[k] = r;
}
function dailyStats(st){
  const items = st.qs.map(q=>hashQ(q.q));
  const now = Date.now();
  return { total: items.length,
           appris: items.filter(k=>SRS[k] && SRS[k].s >= 3).length,
           vus:    items.filter(k=>SRS[k]).length,
           revoir: items.filter(k=>SRS[k] && SRS[k].due <= now).length,
           neufs:  items.filter(k=>!SRS[k]).length };
}
function chooseDaily(st, n){
  n = n || 12;
  const now = Date.now();
  const all = st.qs.map(q => ({ q, k: hashQ(q.q) }));
  const due  = all.filter(x => SRS[x.k] && SRS[x.k].due <= now)
                  .sort((a,b)=>SRS[a.k].due - SRS[b.k].due);
  const neufs = all.filter(x => !SRS[x.k]);
  const reste = all.filter(x => SRS[x.k] && SRS[x.k].due > now)
                   .sort((a,b)=>SRS[a.k].due - SRS[b.k].due);
  const revis = due.slice(0, Math.min(6, due.length));
  let pick = revis.concat(neufs.slice(0, n - revis.length));
  if(pick.length < n) pick = pick.concat(due.slice(revis.length, revis.length + (n-pick.length)));
  if(pick.length < n) pick = pick.concat(reste.slice(0, n - pick.length));
  pick = pick.sort(()=>Math.random()-0.5);
  return pick.map(x => Object.assign({}, x.q, { _k:x.k }));
}

  await store.set(K.hist(kid), hist);
}

    if(cible) cible.sets.push(st); else orphelins.push(st);
  });
  // une matière qui n'existe pas encore chez cet enfant est créée pour lui
  const parMatiere = {};
  orphelins.forEach(st => {
    const nom = (st.subject || '').trim() || 'My chapters';
    (parMatiere[nom] = parMatiere[nom] || []).push(st);
  });
  Object.keys(parMatiere).forEach(nom => subs.push({
    name: nom,
    note: nom==='My chapters' ? 'Chapters added by your parent' : 'Chapters added by your parent',
    noteFr: nom==='My chapters' ? 'Les chapitres ajoutés par tes parents' : 'Ajouté par tes parents',
    sets: parMatiere[nom]
  }));

  const card = (su, i) => {
    const sets = su.sets.filter(st=>!st.learn);
    const done = sets.filter(st=>progress[st.id]);
    const mastered = sets.filter(st=>{
      const p = progress[st.id];
      if(st.daily){ const d = dailyStats(st); return d.appris/d.total >= 0.7; }
      return p && p.best/p.total >= 0.7; });
    const neuf = su.sets.filter(st=>st.custom && !progress[st.id]).length;
    const pct = sets.length ? Math.round(100*mastered.length/sets.length) : 0;
    let msg, col = v.hex;
    if(neuf)                    { msg = `✨ ${neuf} nouveau${neuf>1?'x':''} chapitre${neuf>1?'s':''} à faire ici !`; col = 'var(--amber)'; }
    else if(!done.length)       { msg = "On commence ? / Shall we start?"; col = 'var(--ink-soft)'; }
    else if(pct === 100)        { msg = "Tout est maîtrisé, bravo ! 🎉"; col = 'var(--green)'; }
    else if(pct >= 60)          { msg = "Tu y es presque, continue ! 💪"; col = 'var(--green)'; }
    else if(pct >= 30)          { msg = "Belle progression, continue ! ⭐"; col = v.hex; }
    else                        { msg = "C'est en s'entraînant qu'on y arrive ! 🌱"; col = 'var(--amber)'; }
    return `<button class="card subcard" data-su="${i}" style="border-color:${v.hex}">
      <span class="ic" style="background:${v.hex}">${subIcon(su.name)}</span>
      <span class="bd">
        <span class="ti">${su.name}${neuf?`<span class="newbadge">✨ ${neuf} nouveau${neuf>1?'x':''}</span>`:''}</span>
        <span class="st">${T(su.note||'', su.noteFr||'')}</span>
        <span class="st">${su.sets.length} chapitre(s) · ${mastered.length} maîtrisé(s) sur ${sets.length}</span>
        <span class="barw"><i style="width:${Math.max(pct,3)}%; background:${v.hex}"></i></span>
        <span class="msg" style="color:${col}">${msg}</span>
      </span>
      <span style="font-size:22px; color:${v.hex}">›</span>
    </button>`;
  };

  app.innerHTML = `
  <div class="bar">
    <button class="back" id="bk">← Names</button>
    <span class="who" style="background:${v.hex}">${v.name} · ${v.year}</span>
  </div>
  ${!SYNC.url ? `<div class="card" style="padding:12px 14px; margin-bottom:12px; border-color:var(--red); background:#FEF2F2;">
      <b style="color:var(--red); font-size:14px;">⚠ Cet appareil n'est pas relié</b>
      <div style="font-size:12.5px; margin-top:3px;">Les nouveaux chapitres et les tâches de tes parents n'arriveront pas ici.
      Montre ce message à un adulte : Espace parent → Synchronisation.</div></div>`
    : (syncState !== 'ok' ? `<div class="card" style="padding:12px 14px; margin-bottom:12px; border-color:var(--amber); background:#FFFBEB;">
      <b style="color:#B45309; font-size:14px;">Connexion au serveur impossible</b>
      <div style="font-size:12.5px; margin-top:3px;">L'appareil travaille hors ligne (${syncState}). Les nouveautés arriveront au retour du réseau.</div></div>` : '')}
  <div class="quote">
    <div class="en">${q.en}</div>
    <div class="fr">${q.fr}</div>
    <div class="arq">${q.ar}</div>
  </div>
  <p style="font-size:12.5px; color:var(--ink-soft); text-align:center; margin:6px 0 14px;">
    ${T("A new sentence every day.","Une nouvelle phrase chaque jour.")}</p>
  <button class="card wallet" id="wal" style="border-color:#E08A00">
    <span class="coin">💰</span>
    <span style="flex:1">
      <span class="amt">${money(w.balance||0)}</span>

function findSet(id){
  for(const su of DATA[S.kid].subjects) for(const st of su.sets) if(st.id===id) return st;
  return (CUSTOM[S.kid]||[]).find(st => st.id===id);
}

function startSet(id){
  const st = findSet(id);
  S.set = st.daily ? Object.assign({}, st, { qs: chooseDaily(st, st.perDay || 12) }) : st;
  S.i=0; S.score=0; S.tries=0; S.picked=null; S.log=[];
  question();
}

/* ---------------- une question ---------------- */
function question(){
  const v = DATA[S.kid], st = S.set, q = st.qs[S.i];
  S.tries = 0; S.picked = null; S.skipStep = false;
  const pct = Math.round(100*S.i/st.qs.length);
  app.innerHTML = `
  <div class="bar">
    <button class="back" id="bk">← Chapters</button>
    <span class="who" style="background:${v.hex}">${st.title}</span>
  </div>
  <div class="prog"><i style="width:${pct}%; background:${v.hex}"></i></div>
  <div class="card qcard">
    <div class="qmeta">Question ${S.i+1} of ${st.qs.length}</div>
    <div class="q">${T(q.q, q.fr)}</div>
    ${q.say && canSpeak ? `<button class="speak" id="qsay" style="margin-top:10px;">🔊 ${T("Listen","Écouter")}</button><div id="qwarn"></div>` : ''}
    ${q.t==='sentence'?`<div class="qhelp">${T("Rewrite the whole sentence with the capital letters and the punctuation.","Réécris la phrase entière, avec les majuscules et la ponctuation.")}</div>`:''}
    <div class="answer" id="ans"></div>
    <div id="fb"></div>
    <button class="cta" id="go" style="background:${v.hex}">Check</button>
  </div>`;
  document.getElementById('bk').onclick = ()=>menu(S.kid);
  const qs = document.getElementById('qsay');
  if(qs){ qs.onclick = ()=>say(q.say, q.lang || 'en-GB', m=>{
    const w = document.getElementById('qwarn'); if(w) w.innerHTML = `<p style="font-size:12px; color:var(--red); margin:6px 0 0;">${m}</p>`; }); }
  const ans = document.getElementById('ans');

  if(q.t==='choice'){
    ans.innerHTML = `<div class="choices">${q.c.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join('')}</div>`;
    ans.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      ans.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); S.picked = +b.dataset.i;
    });
  } else {
    const isNum = q.t==='num';
    const stp = q.step;
    const keys = ['7','8','9','4','5','6','1','2','3','−','0','.']
      .concat(stp && stp.type==='expr' ? ['+','×','÷'] : []);
    ans.innerHTML = `
      ${stp?`<div id="stepbox">
        <div class="steplab"><b>Step 1</b> — ${T(stp.ask, stp.askFr)}</div>
        <input class="txt active" id="st1" autocomplete="off" spellcheck="false"
               placeholder="${stp.ph||''}" readonly>
      </div>
      <div class="steplab" id="lab2"><b>Step 2</b> — ${T("the answer","le résultat")}</div>`:''}
      <input class="txt ${stp?'':'active'}" id="inp" autocomplete="off"
             autocapitalize="${q.t==='sentence'?'sentences':'off'}"
             spellcheck="false" placeholder="Your answer…" ${isNum?'readonly':''}>
      <div class="tools">
        ${isNum?`<button class="tool on" data-mode="pad">123 Digits</button>`:''}
        <button class="tool ${isNum?'':'on'}" data-mode="key">⌨️ Keyboard</button>
        <button class="tool" data-mode="pen">✍️ ${T("Write with your finger","Écrire au doigt")}</button>
        ${stp?`<button class="tool" id="skip">${T("I can do it in my head","Je calcule de tête")}</button>`:''}
      </div>
      ${isNum?`<div class="keypad" id="keypad">
        ${keys.map(k=>`<button data-k="${k}" class="${k==='−'?'alt':''}">${k}</button>`).join('')}
        <button data-k="del" class="alt" style="grid-column:span 3">⌫ Delete</button>
      </div>`:''}
      <div class="padwrap hide" id="padwrap">
        <canvas id="pad"></canvas>
        <div class="padbar">
          <button class="tool" id="clr">Clear</button>
          <span class="padhint" id="padhint">${T("Write big, then tap <b>Check</b>.","Écris en gros, puis appuie sur Check.")}</span>
        </div>
      </div>`;
    const inp = document.getElementById('inp');
    const s1  = document.getElementById('st1');
    setActive(s1 || inp);
    [s1, inp].forEach(f=>{ if(!f) return;
      f.addEventListener('pointerdown', ()=>setActive(f));
      f.addEventListener('focus', ()=>setActive(f));
      f.addEventListener('keydown', e=>{ if(e.key!=='Enter') return;
        if(f===s1 && inp){ setActive(inp); inp.focus(); } else check(); });
    });
    if(!isNum) setTimeout(()=>{ if(AF) AF.focus(); },150);

    const sk = document.getElementById('skip');
    if(sk) sk.onclick = ()=>{
      document.getElementById('stepbox').classList.add('hide');
      document.getElementById('lab2').classList.add('hide');
      sk.classList.add('hide'); S.skipStep = true; setActive(inp);
      if(!isNum) inp.focus();
    };

    const kp = document.getElementById('keypad');
    if(kp) kp.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
      const k = b.dataset.k, f = AF || inp;
      if(k==='del'){ f.value = f.value.slice(0,-1); return; }
      if(k==='−'){
        const isCalc = (f.id === 'st1' && stp && stp.type === 'expr');
        const last = f.value.trim().slice(-1);
        if(isCalc || f.value.trim()==='' || '+-*/×÷('.indexOf(last)>=0) f.value += '-';
        else f.value = f.value.startsWith('-') ? f.value.slice(1) : '-'+f.value;
        return;
      }
      f.value += k;
    });

    ans.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
      ans.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on', x===b));
      const m = b.dataset.mode;
      document.getElementById('padwrap').classList.toggle('hide', m!=='pen');
      if(kp) kp.classList.toggle('hide', m!=='pad');
      [s1, inp].forEach(f=>{ if(f) f.readOnly = (m!=='key'); });
      if(m==='pen') initPad();
      if(m==='key' && AF) AF.focus();
    });
  }
  document.getElementById('go').onclick = check;
}

/* ---------------- ardoise ---------------- */
let padCtx=null, drawing=false, hasInk=false, ink=null;
function resetInk(){ ink = {x0:1e9,y0:1e9,x1:-1e9,y1:-1e9}; hasInk=false; }
function grow(x,y){ ink.x0=Math.min(ink.x0,x); ink.y0=Math.min(ink.y0,y); ink.x1=Math.max(ink.x1,x); ink.y1=Math.max(ink.y1,y); }
function padHint(html){ const h=document.getElementById('padhint'); if(h) h.innerHTML=html; }

function initPad(){
  const c = document.getElementById('pad');
  if(!c || c.dataset.ready) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
  padCtx = c.getContext('2d'); padCtx.scale(dpr,dpr);
  padCtx.lineWidth=7; padCtx.lineCap='round'; padCtx.lineJoin='round'; padCtx.strokeStyle='#1B2A5B';
  resetInk();
  const pos = e => { const b=c.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  c.addEventListener('pointerdown', e=>{ e.preventDefault(); drawing=true; hasInk=true; c.setPointerCapture(e.pointerId);
    const [x,y]=pos(e); grow(x,y); padCtx.beginPath(); padCtx.moveTo(x,y); padCtx.lineTo(x+.1,y); padCtx.stroke(); });
  c.addEventListener('pointermove', e=>{ if(!drawing) return; const [x,y]=pos(e); grow(x,y); padCtx.lineTo(x,y); padCtx.stroke(); });
  c.addEventListener('pointerup', ()=>drawing=false);
  c.addEventListener('pointercancel', ()=>drawing=false);
  c.dataset.ready = 1;
  document.getElementById('clr').onclick = ()=>{
    padCtx.clearRect(0,0,c.width,c.height); resetInk();
    padHint(T("Write big, then tap <b>Check</b>.","Écris en gros, puis appuie sur Check."));
    const i=document.getElementById('inp'); if(i) i.value='';
  };
}

/* exporte l'écriture : fond blanc, recadré sur le tracé, agrandi */
function exportInk(){
  const c = document.getElementById('pad');
  const dpr = window.devicePixelRatio||1, m = 26;
  const W = c.width/dpr, H = c.height/dpr;
  let x0 = Math.max(0, ink.x0-m), y0 = Math.max(0, ink.y0-m);
  let x1 = Math.min(W, ink.x1+m), y1 = Math.min(H, ink.y1+m);
  let w = Math.max(40, x1-x0), h = Math.max(40, y1-y0);
  const scale = Math.min(5, Math.max(1.5, 300/h));
  const o = document.createElement('canvas');
  o.width = Math.round(w*scale); o.height = Math.round(h*scale);
  const oc = o.getContext('2d');
  oc.fillStyle = '#FFFFFF'; oc.fillRect(0,0,o.width,o.height);
  oc.drawImage(c, x0*dpr, y0*dpr, w*dpr, h*dpr, 0, 0, o.width, o.height);
  return o.toDataURL('image/png').split(',')[1];
}

/* renvoie le texte lu, ou null */
async function readPad(kind){
  if(!hasInk) return null;
  padHint("Reading your handwriting…");
  const what = kind==='num'
    ? "The child wrote a NUMBER. It can be negative: a dash on the left means a minus sign. It can have a decimal point. Answer with the number only, for example: -5 or 0.45 or 12."
    : "The child wrote a short answer in English (a word or a short sentence). Answer with that text only, keeping the capital letters, apostrophes and punctuation exactly as written.";
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 25000);
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"}, signal: ctrl.signal,
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:[
        {type:"image", source:{type:"base64", media_type:"image/png", data: exportInk()}},
        {type:"text", text:"This image shows a child's handwriting on a white background. "+what+
         " Reply with the transcription and NOTHING else: no quotes, no explanation, no full stop of your own. If the image is empty or unreadable, reply exactly: ???"}]}]})
    });
    clearTimeout(timer);
    const j = await r.json();
    const txt = (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    if(!txt || txt.indexOf('?？')===0 || txt==='???'){ padHint(T("I cannot read this. Write bigger, or use the keyboard.","Je n'arrive pas à lire. Réécris plus gros, ou passe au clavier.")); return null; }
    padHint(T("I read: <b>"+txt.replace(/</g,'&lt;')+"</b> — fix it with the keyboard if that is wrong.","J'ai lu : "+txt.replace(/</g,'&lt;')+" — corrige au clavier si ce n'est pas ça."));
    return txt;
  }catch(e){
    padHint(T("Handwriting reading is not working here. Use the <b>digits</b> or the <b>keyboard</b>.","La lecture de l'écriture ne marche pas ici. Utilise le pavé de chiffres ou le clavier."));
    return null;
  }
}

let AF = null;
function setActive(f){
  if(!f) return;
  AF = f;
  [document.getElementById('st1'), document.getElementById('inp')].forEach(x=>{
    if(x) x.classList.toggle('active', x===f && !x.classList.contains('done'));
  });
}
function evalExpr(str){
  let t = norm(str).replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/\s+/g,'');
  if(!t) return {err:"vide"};
  if(!/^[-+*/().0-9]+$/.test(t)) return {err:T("Use only numbers and signs (+ − × ÷).","Écris seulement des nombres et des signes (+ − × ÷).")};
  try{
    const v = Function('"use strict";return ('+t+')')();
    if(typeof v!=='number' || !isFinite(v)) return {err:T("This calculation does not work. Check the signs.","Ce calcul ne se termine pas. Vérifie les signes.")};
    return {v, raw:t};
  }catch(e){ return {err:T("This calculation is not written correctly. Check the signs and the brackets.","Ce calcul n'est pas écrit correctement. Vérifie les signes et les parenthèses.")}; }
}
function judgeStep(stp, val){
  if(!val.trim()) return {ok:false, why:T("Write step 1 first — or tap « I can do it in my head ».","Écris d'abord l'étape 1 — ou appuie sur « Je calcule de tête ».")};
  if(stp.type==='num'){
    const v = numVal(val);
    if(isNaN(v)) return {ok:false, why:T("Write a number.","Écris un nombre.")};
    if(Math.abs(v-stp.a)<1e-9) return {ok:true};
    if(Math.abs(v+stp.a)<1e-9) return {ok:false, why:T("The number is right, but <b>the sign is wrong</b>.","Le nombre est bon, mais le signe est faux.")};
    return {ok:false, why:stp.e};
  }
  const flat = norm(val).replace(/×/g,'*').replace(/÷/g,'/').replace(/\s+/g,'');
  if(flat.indexOf('--')>=0)
    return {ok:false, why:T("There is still a <b>« − − »</b> in your calculation. That is exactly what becomes a <b>+</b>.","Il reste un « − − » dans ton calcul. C'est justement lui qu'il faut remplacer par un +.")};
  const r = evalExpr(val);
  if(r.err) return {ok:false, why:r.err};
  if(!/[+\-*/]/.test(r.raw.slice(1)))
    return {ok:false, why:T("Write the <b>calculation</b>, not just the answer.","Écris le calcul, pas seulement le résultat.") + (stp.ph?" ("+stp.ph+")":"")};
  if(Math.abs(r.v-stp.want)>1e-9) return {ok:false, why:stp.e};
  return {ok:true};
}

  document.getElementById('fb').innerHTML =
    `<div class="fb tip"><span class="mark">${pencil()}</span><span><h3>${T("Look at step 1 again","Étape 1 à revoir")}</h3><p>${txt}</p></span></div>`;
}
function pencil(){ return `<svg viewBox="0 0 40 40" width="40"><path d="M8 32 L12 22 L28 6 L34 12 L18 28 Z" fill="none" stroke="#E08A00" stroke-width="4" stroke-linejoin="round"/></svg>`; }

/* ---------------- correction ---------------- */
const norm = s => (s||'').toString().trim().replace(/[’‘`]/g,"'").replace(/[−–—]/g,'-').replace(/\s+/g,' ');
const bare = s => norm(s).toLowerCase().replace(/[.,!?;:"']/g,'').replace(/\s+/g,' ').trim();
function numVal(s){ return parseFloat(norm(s).replace(/\s/g,'').replace(',','.')); }

function judge(q, given){
  if(q.t==='choice') return { ok: S.picked===q.a };
  if(given===''||given==null) return { ok:false, why:"Écris une réponse avant de vérifier." };
  if(q.t==='num'){
    const v = numVal(given);
    if(isNaN(v)) return { ok:false, why:T("I did not understand that number. Write for example −5 or 0.45.","Je n'ai pas compris ce nombre. Écris par exemple −5 ou 0.45.") };
    if(Math.abs(v-q.a) < 1e-9) return { ok:true };
    if(Math.abs(v+q.a) < 1e-9) return { ok:false, why:T("The number is right, but <b>the sign is wrong</b>.","Le nombre est bon, mais le signe est faux. Relis la règle des signes.") };
    return { ok:false };
  }
  const accepted = q.a.map(x=>x);
  if(q.t==='text'){
    const g = bare(given);
    if(accepted.some(a=>bare(a)===g)){
      if(q.strict && !q.strict.some(a=>norm(a).toLowerCase()===norm(given).toLowerCase()))
        return { ok:false, why:T("The <b>apostrophe</b> is missing: " + q.strict[0] + ".","Il manque l'apostrophe : " + q.strict[0] + ".") };
      return { ok:true };
    }
    return { ok:false };
  }
  // sentence
  if(accepted.some(a=>norm(a)===norm(given))) return { ok:true };
  if(accepted.some(a=>norm(a).toLowerCase()===norm(given).toLowerCase()))
    return { ok:false, why:T("Everything is right except <b>the capital letters</b>.","Tout est bon sauf les majuscules. Regarde chaque nom propre et le début de la phrase.") };
  if(accepted.some(a=>bare(a)===bare(given)))
    return { ok:false, why:T("The words are right: <b>a capital letter or the punctuation</b> is missing.","Les mots sont bons : il manque la ponctuation ou une majuscule. Une phrase finit par un point.") };
  return { ok:false };
}

let busy = false;

function lockAndShow(q, cardHTML){

}
function solutionOf(q){
  return q.t==='choice' ? q.c[q.a]
       : q.t==='num'    ? String(q.a).replace('-','−')
       : q.a[0];
}
function wrongCard(q, lead, extra){
  return `<div class="fb no">
    <span class="mark">${cross()}</span>
    <span><h3>${lead}</h3>
    ${extra||''}
    <p>${T("The correct answer is:","La bonne réponse :")}</p>

async function check(){
  if(busy) return;
  const q = S.set.qs[S.i];
  const inp = document.getElementById('inp');
  const go = document.getElementById('go');
  if(q.t==='choice' && S.picked===null){ flash(T("Choose an answer.","Choisis une réponse.")); return; }

  const s1 = document.getElementById('st1');
  const stepOn = !!(q.step && s1 && !S.skipStep && !document.getElementById('stepbox').classList.contains('hide'));

  // mode écriture : on lit le tracé dans le champ actif
  const penOn = !!document.querySelector('[data-mode="pen"].on');
  const field = (AF && AF.offsetParent!==null) ? AF : inp;
  if(field && penOn && !field.value.trim()){
    if(!hasInk){ flash(T("Write your answer on the board, then tap Check.","Écris ta réponse sur l'ardoise, puis appuie sur Check.")); return; }
    busy = true; const lbl = go.textContent; go.textContent = "Reading your handwriting…";
    const txt = await readPad(stepOn && field===s1 && q.step.type==='expr' ? 'expr' : q.t);
    go.textContent = lbl; busy = false;
    if(txt===null) return;          // lecture ratée : rien n'est décompté
    field.value = txt;
  }

  // étape 1 : elle fait partie de l'exercice, une seule chance aussi
  if(stepOn){
    if(!s1.value.trim()){ tip(T("Write step 1 first — or tap « I can do it in my head ».","Écris d'abord l'étape 1 — ou appuie sur « Je calcule de tête ».")); setActive(s1); return; }
    const rs = judgeStep(q.step, s1.value);
    if(!rs.ok){
      if(q._k) srsUpdate(q._k, false);
      S.log.push({q:q.q, ok:false, a:'étape 1 : '+s1.value, c:solutionOf(q)});
      if(q.t==='choice') markChoices(q);
      lockAndShow(q, wrongCard(q, T("Step 1 is wrong.","L'étape 1 est fausse."),
        `<p>${rs.why||''}</p>`));
      return;
    }
    s1.classList.add('done'); s1.classList.remove('active');
    if(!inp.value.trim()){
      setActive(inp);
      if(penOn && padCtx){ const c=document.getElementById('pad'); padCtx.clearRect(0,0,c.width,c.height); resetInk();
        padHint(T("Step 1 is right! Now write the <b>answer</b>.","Étape 1 juste ! Écris maintenant le résultat.")); }
      document.getElementById('fb').innerHTML =
        `<div class="fb ok"><span class="mark">${tick()}</span><span><h3>${T("Step 1 is right!","Étape 1 juste !")}</h3><p>${T("Now write the answer.","Écris maintenant le résultat.")}</p></span></div>`;
      if(!inp.readOnly) inp.focus();
      return;
    }
  }

  const given = inp ? inp.value : '';
  if(inp && !given.trim()){ flash(T("Write an answer before you check.","Écris une réponse avant de vérifier.")); return; }
  const res = judge(q, given);
  if(q.t==='choice') markChoices(q);

  const typed = (q.t==='choice') ? (S.picked!=null ? q.c[S.picked] : '') : given;
  if(q._k) srsUpdate(q._k, res.ok);
  if(res.ok){
    S.score += 1;
    S.log.push({q:q.q, ok:true, a:typed, c:solutionOf(q)});
    lockAndShow(q, `<div class="fb ok">
      <span class="mark">${tick()}</span>
      <span><h3>${(b=>T(b[0],b[1]))(pick(BRAVO))}</h3>
      <p>${q.e||''}</p></span></div>`);
    return;
  }

  S.log.push({q:q.q, ok:false, a:typed, c:solutionOf(q)});
  lockAndShow(q, wrongCard(q, T("That's wrong.","C'est faux."), res.why?`<p>${res.why}</p>`:''));
}
function markChoices(q){
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled = true; b.classList.remove('sel');
    if(+b.dataset.i===q.a) b.classList.add('good');
    else if(+b.dataset.i===S.picked) b.classList.add('bad');
  });
}

  const ts = TASKS[kid] || [];

  app.innerHTML = `

    <span class="who" style="background:${v.hex}">Cagnotte · ${v.name}</span></div>

  <div class="card" style="padding:18px; text-align:center; border-color:#E08A00;">

    ${wait.map(t=>`<div class="task" style="box-shadow:none;">
      <span class="ti">${t.title}${t.note?`<br><small style="font-weight:400; color:var(--ink-soft)">${t.note}</small>`:''}</span>

    <div class="field"><label>Précision (facultatif)</label><input id="t-note" placeholder="avant ce soir, lit fait et bureau rangé"></div>
    <div class="field"><label>Récompense en ${REWARD.cur}</label><input id="t-amt" inputmode="decimal" placeholder="10"></div>

        <button class="go" data-del="${t.id}" style="background:var(--ink-soft)">Retirer</button></div>`).join('')}`:''}
  </div>

  <div class="card" style="padding:16px; margin-top:14px;">
    <h3 style="font-size:16px;">La récompense quotidienne</h3>

      <div class="field"><label>Réussite minimum (%)</label><input id="r-p" value="${REWARD.minPct}" inputmode="numeric"></div>

  };

/* ---------------- le détail d'une séance ---------------- */
async function session(kid, ts){
  const v = DATA[kid];
  const hist = (await store.get(K.hist(kid))) || [];
  const h = hist.find(x => x.ts === ts);
  if(!h){ parents(); return; }
  const pc = Math.round(100*h.score/h.total);
  const col = pc>=70?'var(--green)':pc>=50?'var(--amber)':'var(--red)';
  app.innerHTML = `
  <div class="bar"><button class="back" id="bk">← Espace parent</button>
    <span class="who" style="background:${v.hex}">${v.name} · ${frDate(h.d)}</span></div>
  <div class="card result" style="padding:22px 18px;">
    <div class="circle"><span class="big">${h.score}/${h.total}</span></div>
    <h2 style="font-size:21px; margin-top:14px;">${h.title||h.set}</h2>
    <p>Séance du ${new Date(h.ts).toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'})}
       à ${new Date(h.ts).toLocaleTimeString('fr-FR',{hour:'2-digit', minute:'2-digit'})}</p>
  </div>
  <div class="card" style="padding:16px; margin-top:14px;">
    ${(h.qs||[]).map((x,i)=>`
      <div style="display:flex; gap:10px; padding:10px 2px; border-bottom:1px dotted #DDD8C8;">
        <b style="flex:none; width:22px; color:${x.ok?'var(--green)':'var(--red)'}; font-size:17px;">${x.ok?'✓':'✗'}</b>
        <div style="flex:1; min-width:0;">
          <div style="font-size:14px; font-weight:700;">${i+1}. ${x.q}</div>
          <div style="font-size:13px; margin-top:2px;">
            Sa réponse : <b style="color:${x.ok?'var(--green)':'var(--red)'}">${x.a || '—'}</b>
            ${x.ok ? '' : ` &nbsp;·&nbsp; attendu : <b style="color:var(--green)">${x.c}</b>`}
          </div>
        </div>
      </div>`).join('') || '<p style="font-size:13.5px; color:var(--ink-soft)">Le détail n\'a pas été enregistré pour cette séance.</p>'}
  </div>
  <p class="foot">Le détail question par question est conservé pour les 30 dernières séances de chaque enfant.</p>`;
  document.getElementById('bk').onclick = parents;
}

/* ---------------- import d'un chapitre préparé (JSON) ---------------- */
function checkChapter(o){
  if(!o || typeof o!=='object') throw "ce n'est pas un chapitre";
  if(!o.title) throw "il manque le titre (title)";
  if(!Array.isArray(o.qs) || !o.qs.length) throw "il manque les questions (qs)";
  o.qs.forEach((q,i)=>{
    const n = 'question '+(i+1);
    if(!q.q) throw "il manque l'énoncé de la "+n;
    if(q.t==='choice'){
      if(!Array.isArray(q.c) || q.c.length<2) throw "il faut au moins 2 propositions à la "+n;
      if(typeof q.a!=='number' || q.a<0 || q.a>=q.c.length) throw "la bonne réponse de la "+n+" est hors de la liste";
    } else if(q.t==='num'){
      if(typeof q.a!=='number') throw "la réponse de la "+n+" doit être un nombre";
    } else if(q.t==='text' || q.t==='sentence'){
      if(!Array.isArray(q.a) || !q.a.length) throw "il manque la réponse de la "+n;
    } else throw "type inconnu à la "+n+" (attendu : num, text, sentence ou choice)";
  });
  return true;
}
function importer(kid){
  const v = DATA[kid];
  app.innerHTML = `
  <div class="bar"><button class="back" id="bk">← Espace parent</button>
    <span class="who" style="background:${v.hex}">Importer · ${v.name}</span></div>
  <div class="card" style="padding:18px 16px;">
    <h2 style="font-size:20px;">Coller un chapitre</h2>
    <p style="font-size:13px; margin:6px 0 0;">Colle ici le chapitre préparé (format JSON), ou choisis le fichier <b>.json</b> reçu.
    Il s'ajoutera chez ${v.name} dans « My chapters » et se synchronisera sur tous les appareils.</p>
    <div class="field"><textarea id="js" style="min-height:220px; font-family:ui-monospace,monospace; font-size:12.5px;" placeholder='{ "title": "...", "qs": [ ... ] }'></textarea></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="tool" id="pick">📄 Choisir un fichier .json</button>
      <input type="file" id="file" accept="application/json,.json" style="display:none">
    </div>
    <div id="msg" style="margin-top:10px;"></div>
    <button class="cta" id="go" style="background:${v.hex}; margin-top:12px;">Vérifier et prévisualiser</button>
  </div>`;
  document.getElementById('bk').onclick = parents;
  document.getElementById('pick').onclick = ()=>document.getElementById('file').click();
  document.getElementById('file').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{ document.getElementById('js').value = fr.result; };
    fr.readAsText(f);
  };
  document.getElementById('go').onclick = async ()=>{
    const msg = document.getElementById('msg');
    let data;
    try{ data = JSON.parse(document.getElementById('js').value); }
    catch(e){ msg.innerHTML = `<div class="fb no"><span class="mark">${cross()}</span><span><h3>Fichier illisible</h3><p>Le texte collé n'est pas du JSON valide.</p></span></div>`; return; }
    const list = Array.isArray(data) ? data : [data];
    try{ list.forEach(checkChapter); }
    catch(err){ msg.innerHTML = `<div class="fb no"><span class="mark">${cross()}</span><span><h3>Chapitre incomplet</h3><p>${err}</p></span></div>`; return; }
    // aperçu avant d'ajouter
    const n = list.reduce((a,o)=>a+o.qs.length,0);
    const sol = q => q.t==='choice' ? q.c[q.a] : (q.t==='num' ? String(q.a) : q.a.join(' / '));
    msg.innerHTML = `
      <div class="fb ok" style="margin-bottom:12px;"><span class="mark">${tick()}</span><span>
        <h3>Fichier valide</h3><p>${list.length} chapitre(s), ${n} questions. Relis ci-dessous avant d'ajouter.</p></span></div>
      ${list.map(o=>`
        <div class="card" style="padding:14px; margin-bottom:12px;">
          <h3 style="font-size:17px; color:${v.hex}">${o.title||'(sans titre)'}</h3>
          <div style="font-size:12.5px; color:var(--ink-soft)">${o.titleFr||''} · ${o.subject||'My chapters'} · ${o.qs.length} questions</div>
          ${o.qs.map((q,i)=>`
            <div style="padding:9px 0; border-bottom:1px dotted #DDD8C8;">
              <div style="font-size:14px; font-weight:700;">${i+1}. ${q.q}</div>
              ${q.fr?`<div style="font-size:12.5px;" class="fr">${q.fr}</div>`:''}
              ${q.c?`<div style="font-size:12.5px; margin-top:3px;">Propositions : ${q.c.join(' &nbsp;·&nbsp; ')}</div>`:''}
              <div style="font-size:13px; margin-top:3px;">Réponse : <b style="color:var(--green)">${sol(q)}</b>${q.say?` &nbsp;·&nbsp; 🔊 ${q.say}`:''}</div>
              ${q.e?`<div style="font-size:12.5px; color:var(--ink-soft); margin-top:2px;">${q.e}</div>`:''}
            </div>`).join('')}
        </div>`).join('')}
      <button class="cta" id="confirm" style="background:${v.hex}">Ajouter chez ${v.name}</button>`;
    document.getElementById('confirm').onclick = async ()=>{
      list.forEach(o=>{
        o.id = o.id || ('p-'+Date.now()+'-'+Math.floor(Math.random()*999));
        o.custom = true; o.subject = o.subject || 'My chapters';
        o.sub = o.sub || o.subject; o.titleFr = o.titleFr || ''; o.subFr = o.subFr || '';
        CUSTOM[kid].push(o);
      });
      await saveCustom(kid);
      const envoye = SYNCLOG.length && SYNCLOG[SYNCLOG.length-1].ok;
      msg.innerHTML = `<div class="fb ${envoye?'ok':'no'}"><span class="mark">${envoye?tick():cross()}</span><span>
        <h3>${envoye?'Ajouté et envoyé !':'Ajouté sur cet appareil seulement'}</h3>
        <p>${list.length} chapitre(s), ${n} questions, chez ${v.name}.</p>
        ${envoye?'':`<p style="color:var(--red)"><b>L'envoi au serveur a échoué</b> — les autres appareils ne le verront pas.<br>${syncError||'synchronisation non configurée'}</p>`}</span></div>`;
      setTimeout(parents, 1200);
    };
  };
}

/* ---------------- éditeur de chapitre ---------------- */
let E = null;
function editor(kid){
  E = E && E.kid===kid ? E : { kid, subject:'Maths', title:'', titleFr:'', sub:'', subFr:'', qs:[] };
  drawEditor();
}
function drawEditor(){
  const v = DATA[E.kid];
  app.innerHTML = `
  <div class="bar"><button class="back" id="bk">← Espace parent</button>
    <span class="who" style="background:${v.hex}">Nouveau chapitre · ${v.name}</span></div>
  <div class="card" style="padding:18px 16px;">
    <h2 style="font-size:20px;">Le chapitre</h2>
    <div class="field"><label>Matière</label>
      <select id="f-subject"><option>Maths</option><option>English</option><option>Science</option><option>French</option></select></div>
    <div class="field"><label>Titre en anglais (vu par l'enfant)</label><input id="f-title" value="${E.title}" placeholder="Fractions"></div>
    <div class="field"><label>Traduction française (le petit i)</label><input id="f-titleFr" value="${E.titleFr}" placeholder="Les fractions"></div>
    <div class="field"><label>Sous-titre en anglais</label><input id="f-sub" value="${E.sub}" placeholder="Adding simple fractions"></div>
    <div class="field"><label>Sous-titre en français</label><input id="f-subFr" value="${E.subFr}" placeholder="Additionner des fractions simples"></div>
  </div>

  <div class="card" style="padding:18px 16px; margin-top:14px;">
    <h2 style="font-size:20px;">Ajouter une question</h2>
    <div class="field"><label>Type de réponse</label>
      <select id="q-type">
        <option value="num">Un nombre</option>
        <option value="text">Un mot ou une expression</option>
        <option value="choice">Choix multiple</option>
      </select></div>
    <div class="field"><label>Question, en anglais</label><textarea id="q-q" placeholder="What is 1/2 + 1/4?"></textarea></div>
    <div class="field"><label>Traduction française (facultatif)</label><input id="q-fr" placeholder="Combien font 1/2 + 1/4 ?"></div>
    <div class="field"><label>Mot ou phrase à écouter 🔊 (facultatif)</label><input id="q-say" placeholder="a butterfly"></div>
    <div class="field"><label>Langue de la voix</label>
      <select id="q-lang"><option value="en-GB">Anglais</option><option value="ar-SA">Arabe</option><option value="fr-FR">Français</option></select></div>
    <div id="q-ans"></div>
    <div class="field"><label>Explication en français (affichée après la réponse)</label>
      <textarea id="q-e" placeholder="On met les fractions au même dénominateur…"></textarea></div>
    <button class="cta" id="q-add" style="background:${v.hex}">Ajouter cette question</button>
  </div>

  <div class="card" style="padding:18px 16px; margin-top:14px;">
    <h2 style="font-size:20px;">Questions du chapitre (${E.qs.length})</h2>
    ${E.qs.length ? E.qs.map((q,i)=>`<div class="qrow"><b>${i+1}. ${q.q}<br><small style="color:var(--ink-soft)">réponse : ${
        q.t==='choice' ? q.c[q.a] : (q.t==='num' ? q.a : q.a.join(' / '))}</small></b>
      <button class="del" data-q="${i}">✕</button></div>`).join('')
      : '<p style="font-size:13.5px; color:var(--ink-soft)">Aucune question pour le moment.</p>'}
    <button class="cta" id="save" style="background:var(--ink); margin-top:14px;">Enregistrer le chapitre</button>
  </div>`;

  document.getElementById('bk').onclick = ()=>{ parents(); };
  document.getElementById('f-subject').value = E.subject;
  const drawAns = () => {
    const t = document.getElementById('q-type').value;
    document.getElementById('q-ans').innerHTML =
      t==='num' ? `<div class="field"><label>La bonne réponse (un nombre, − pour négatif)</label><input id="q-a" inputmode="text" placeholder="-3"></div>`
    : t==='text'? `<div class="field"><label>Réponses acceptées, séparées par des points-virgules</label><input id="q-a" placeholder="spoke ; he spoke"></div>`
    : `<div class="field"><label>Les propositions (une par ligne, mets la bonne en premier)</label>
       <textarea id="q-a" placeholder="its&#10;it's"></textarea></div>`;
  };
  document.getElementById('q-type').onchange = drawAns; drawAns();

  document.getElementById('q-add').onclick = ()=>{
    const t = document.getElementById('q-type').value;
    const qt = document.getElementById('q-q').value.trim();
    const fr = document.getElementById('q-fr').value.trim();
    const e  = document.getElementById('q-e').value.trim();
    const raw= document.getElementById('q-a').value.trim();
    if(!qt || !raw){ alert("Il faut au moins la question et la réponse."); return; }
    let q;
    if(t==='num'){
      const n = parseFloat(raw.replace(/−/g,'-').replace(',','.'));
      if(isNaN(n)){ alert("La réponse doit être un nombre."); return; }
      q = { t:'num', q:qt, a:n };
    } else if(t==='text'){
      q = { t:'text', q:qt, a: raw.split(';').map(x=>x.trim()).filter(Boolean) };
    } else {
      const opts = raw.split('\n').map(x=>x.trim()).filter(Boolean);
      if(opts.length<2){ alert("Mets au moins deux propositions."); return; }
      const good = opts[0];
      const mixed = opts.slice().sort(()=>Math.random()-0.5);
      q = { t:'choice', q:qt, c:mixed, a:mixed.indexOf(good) };
    }
    const sy = document.getElementById('q-say').value.trim();
    if(fr) q.fr  = fr;
    if(e)  q.e   = e;
    if(sy){ q.say = sy; q.lang = document.getElementById('q-lang').value; }
    E.qs.push(q); drawEditor();
  };
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ E.qs.splice(+b.dataset.q,1); drawEditor(); });

  ['subject','title','titleFr','sub','subFr'].forEach(f=>{
    const el = document.getElementById('f-'+f);
    el.addEventListener('input', ()=>{ E[f] = el.value; });
    el.addEventListener('change', ()=>{ E[f] = el.value; });
  });

  document.getElementById('save').onclick = async ()=>{
    ['subject','title','titleFr','sub','subFr'].forEach(f=>{ E[f] = document.getElementById('f-'+f).value.trim(); });
    if(!E.title){ alert("Donne un titre au chapitre."); return; }
    if(!E.qs.length){ alert("Ajoute au moins une question."); return; }
    const st = { id:'p-'+Date.now(), custom:true, subject:E.subject,
                 title:E.title, titleFr:E.titleFr, sub:E.sub||E.subject, subFr:E.subFr, qs:E.qs };
    CUSTOM[E.kid].push(st); await saveCustom(E.kid);
    const kid = E.kid; E = null;
    alert("Chapitre enregistré ! Il apparaît chez "+DATA[kid].name+" dans « My chapters ».");
    parents();
  };
}


(async function init(){
  loadSyncSettings();
  await dbLoad();
  // reprise des données enregistrées par les versions précédentes (une clé par entrée)
  if(hasArtifact && !Object.keys(DB).length){
    const tryKey = async (k) => { try{ const r = await window.storage.get(k, true); return r?JSON.parse(r.value):null; }catch(e){ return null; } };
    const code = (await tryKey('cahier:code')) || 'famille';
    const found = {};
    for(const kid of ['lina','ilyes']){
      for(const kind of ['prog','hist','sets']){
        const v = await tryKey(`c:${code}:${kind}:${kid}`);
        if(v) found[`c:${code}:${kind}:${kid}`] = v;
      }
      const older = await tryKey('cahier:'+kid);
      if(older && !found[`c:${code}:prog:${kid}`]) found[`c:${code}:prog:${kid}`] = older;
    }
    if(Object.keys(found).length){ found['cahier:code'] = code; DB = Object.assign(DB, found); await dbSave(); }
  }
  await loadCode(); await loadCustom(); await loadMoney();
  home();
})();
</script>
